(#ARR)"/><text x="331" y="127" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">Linear</text><rect x="366" y="131" width="44" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="388" y="140" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">10</text><text x="420" y="140" text-anchor="start" dominant-baseline="central" fill="var(--accent)" style="font-size:11px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">650 params</text></svg><figcaption><b>Two heads on the same conv layers.</b> Flattening keeps every feature at its position, so the linear layer learns position-specific weights (16384·10 + 10 parameters). Global average pooling keeps only how strongly each of the 64 features fired (64·10 + 10 parameters).</figcaption></figure>
