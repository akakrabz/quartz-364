 GD converges only for α &lt; 2/20.2 ≈ 0.099. The exam's α = 1/8 gives the correct two steps (1/2, 0) and (3/4, −3/8), but continued it would diverge (the path leaves the plot after a few more steps).</figcaption></figure>
