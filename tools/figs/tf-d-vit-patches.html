cores</text></svg><figcaption><b>An image as a sequence of tokens</b> (the lecture's Vision Transformer on a 160 × 160 crop). The image is cut into non-overlapping 16 × 16 patches; each patch is flattened to 3 · 16 · 16 = 768 numbers and passed through one shared linear layer, which plays the role <code>nn.Embedding</code> plays for words. A learned <code>&lt;CLS&gt;</code> vector is put in front, a learned position vector is added to each of the 101 tokens, and from there the model is the text classifier again.</figcaption></figure>
