<figure class="cs-fig"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" width="600" height="140" role="img" style="font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:13px"><title>A bar split 60/20/20 into train, validation and test</title><defs><marker id="ARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><rect x="20" y="24" width="336" height="40" rx="4" fill="var(--accent)" fill-opacity="0.12" stroke="var(--accent)" stroke-width="1.8"/><text x="188" y="44" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">train  60%</text><text x="188" y="80" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">fit the weights θ</text><rect x="356" y="24" width="112" height="40" rx="4" fill="var(--accent2)" fill-opacity="0.12" stroke="var(--accent2)" stroke-width="1.8"/><text x="412" y="44" text-anchor="middle" dominant-baseline="central" fill="var(--accent2)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">val  20%</text><text x="412" y="80" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">choose</text><text x="412" y="95" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">hyperparameters</text><rect x="468" y="24" width="112" height="40" rx="4" fill="var(--hi)" fill-opacity="0.12" stroke="var(--hi)" stroke-width="1.8"/><text x="524" y="44" text-anchor="middle" dominant-baseline="central" fill="var(--hi)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">test  20%</text><text x="524" y="80" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">final score,</text><text x="524" y="95" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">used once</text><text x="300" y="126" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">shuffle the indices once, then cut; the three sets never share an example</text></svg><figcaption><b>Train / validation / test.</b> The lecture's 60 : 20 : 20 split. Only the training set produces gradients; the validation set is looked at many times (to choose learning rate, epochs, weight decay, model size), so it is no longer an honest estimate. The test set is touched once.</figcaption></figure>
