lipPath></defs></svg> <figcaption><b>Timestep sampling densities</b> from Esser et al. (2024), eq. 19: t = sigmoid(u) with u drawn from a normal distribution N(m, s²). Compared with uniform t, the logit-normal puts more training weight on intermediate noise levels and almost none at the two ends; a positive m shifts it towards noise.</figcaption></figure>
