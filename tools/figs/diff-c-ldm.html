ent)" stroke-width="1.6"/><text x="290" y="115" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">latent z</text><text x="290" y="131" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">64×64×4</text><line x1="338" y1="123" x2="368" y2="123" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M368.0,123.0 L361.0,126.5 L361.0,119.5 Z" fill="currentColor"/><rect x="370" y="60" width="170" height="126" rx="10" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.8"/><text x="455" y="80" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:13px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-weight:600;">denoiser ε_θ</text><text x="455" y="99" text-anchor="middle" dominant-baseline="central" fill="var(--accent)" style="font-size:11px;font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;">ε_θ(z_t, t, τ_θ(y))</text><text x="455" y="118" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">U-Net + cross-attention</text><text x="455" y="138" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">noise z_T → … → z_0</text><text x="455" y="158" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">T denoising steps,</text><text x="455" y="174" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:11px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">all in latent space</text><line x ="var(--hi)" stroke-width="1.5" stroke-linecap="round"/><path d="M455.0,190.0 L458.5,197.0 L451.5,197.0 Z" fill="var(--hi)"/><text x="462" y="194" text-anchor="start" dominant-baseline="central" fill="var(--hi)" style="font-size:10px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">keys, values</text><text x="360" y="30" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" style="font-size:11px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">training: z = ℰ(x) is noised and denoised; ℰ and 𝒟 are trained first, then frozen</text></svg><figcaption><b>Latent diffusion</b> (Rombach et al., 2022), with the Stable Diffusion v1 sizes from its model card: an autoencoder with downsampling factor f = 8 maps a 512×512×3 image to a 64×64×4 latent, 48 times fewer numbers. The diffusion model (a U-Net) runs entirely on latents; the prompt enters every attention block as the keys and values of cross-attention. One decoder pass turns the final latent into pixels.</figcaption></figure>
