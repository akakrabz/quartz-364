ans-serif;">are two tokens: self-attention</text><text x="242" y="152" text-anchor="start" dominant-baseline="central" fill="var(--muted)" style="font-size:12px;font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;">relates them in the first layer</text></svg><figcaption>Fall 2025 Problem 5(b), (d). A 64 × 64 image cut into 8 × 8 patches with stride 8 gives an 8 × 8 grid: 64 tokens, each a flattened 3 × 8 × 8 = 192-vector. At 128 × 128 the same model would simply see 16 × 16 = 256 tokens.</figcaption></figure>
